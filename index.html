<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Blok Copy Paste</title>

<style>
    body{
        font-family: Arial, sans-serif;
        max-width:800px;
        margin:40px auto;
        padding:20px;
        line-height:1.7;
        background:#f5f5f5;
    }

    .box{
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,.1);

        /* Tidak bisa diseleksi */
        user-select:none;
        -webkit-user-select:none;
        -moz-user-select:none;
        -ms-user-select:none;
    }

    textarea{
        width:100%;
        height:120px;
        margin-top:20px;
    }

    .warning{
        color:red;
        font-weight:bold;
        margin-top:15px;
    }
</style>
</head>
<body>

<h2>Demo Blok Copy Paste</h2>

<div class="box">
Lorem ipsum dolor sit amet consectetur adipisicing elit.
Coba blok teks ini.
Klik kanan.
Tekan Ctrl + C.
Tekan Ctrl + A.
Semuanya akan diblok menggunakan JavaScript.
</div>

<textarea placeholder="Coba paste di sini"></textarea>

<div class="warning" id="msg"></div>

<script>

function showMessage(text){
    document.getElementById("msg").innerHTML=text;

    clearTimeout(window.timeout);

    window.timeout=setTimeout(()=>{
        document.getElementById("msg").innerHTML="";
    },2000);
}

// Blok klik kanan
document.addEventListener("contextmenu",function(e){
    e.preventDefault();
    showMessage("Klik kanan dinonaktifkan");
});

// Blok copy
document.addEventListener("copy",function(e){
    e.preventDefault();
    showMessage("Copy diblok");
});

// Blok cut
document.addEventListener("cut",function(e){
    e.preventDefault();
    showMessage("Cut diblok");
});

// Blok paste
document.addEventListener("paste",function(e){
    e.preventDefault();
    showMessage("Paste diblok");
});

// Blok drag
document.addEventListener("dragstart",function(e){
    e.preventDefault();
});

// Blok shortcut keyboard
document.addEventListener("keydown",function(e){

    if(e.ctrlKey){

        switch(e.key.toLowerCase()){

            case "c":
            case "v":
            case "x":
            case "a":
            case "u":
            case "s":

                e.preventDefault();
                showMessage("Shortcut diblok");
                break;
        }
    }

    // F12
    if(e.key==="F12"){
        e.preventDefault();
        showMessage("F12 diblok");
    }

});

</script>

</body>
</html>
