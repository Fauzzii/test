<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Timer & Blok Copy Paste</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:800px;
    margin:40px auto;
    background:#f5f5f5;
    line-height:1.7;
}

.container{
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.box{
    margin-top:20px;
    padding:20px;
    background:#eee;

    user-select:none;
    -webkit-user-select:none;
}

button{
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

.timer{
    font-size:32px;
    font-weight:bold;
    color:#d63031;
    margin:20px 0;
}

.warning{
    color:red;
    font-weight:bold;
    margin-top:15px;
}

textarea{
    width:100%;
    height:120px;
    margin-top:20px;
}
</style>

</head>
<body>

<div class="container">

<h2>Demo Timer JavaScript</h2>

<div class="timer" id="timer">
01:00
</div>

<button id="startBtn">
Mulai
</button>

<div class="box">
Silakan coba blok teks ini.
Copy, Paste, Klik Kanan, Ctrl+C semuanya diblok menggunakan JavaScript.
</div>

<textarea placeholder="Coba paste di sini"></textarea>

<div class="warning" id="msg"></div>

</div>

<script>

function showMessage(text){

    msg.innerHTML=text;

    clearTimeout(window.timeout);

    window.timeout=setTimeout(()=>{
        msg.innerHTML="";
    },2000);

}

const timer=document.getElementById("timer");
const msg=document.getElementById("msg");
const startBtn=document.getElementById("startBtn");

let duration=60;
let countdown=null;

startBtn.addEventListener("click",()=>{

    if(countdown) return;

    countdown=setInterval(()=>{

        let menit=Math.floor(duration/60);
        let detik=duration%60;

        timer.innerHTML=
            String(menit).padStart(2,"0")
            +":"
            +String(detik).padStart(2,"0");

        duration--;

        if(duration<0){

            clearInterval(countdown);

            timer.innerHTML="WAKTU HABIS";

            alert("Waktu habis");

        }

    },1000);

});

document.addEventListener("contextmenu",(e)=>{
    e.preventDefault();
    showMessage("Klik kanan diblok");
});

document.addEventListener("copy",(e)=>{
    e.preventDefault();
    showMessage("Copy diblok");
});

document.addEventListener("cut",(e)=>{
    e.preventDefault();
    showMessage("Cut diblok");
});

document.addEventListener("paste",(e)=>{
    e.preventDefault();
    showMessage("Paste diblok");
});

document.addEventListener("keydown",(e)=>{

    if(e.ctrlKey){

        const key=e.key.toLowerCase();

        if(["a","c","v","x","u","s"].includes(key)){

            e.preventDefault();

            showMessage("Shortcut diblok");

        }

    }

});

</script>

</body>
</html>
